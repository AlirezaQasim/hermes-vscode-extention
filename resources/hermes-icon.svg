<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)" filter="url(#glow)" opacity="0.15"/>
  
  <!-- Main symbol - stylized H for Hermes -->
  <g transform="translate(64, 64)">
    <!-- Wings -->
    <path d="M-30,-10 Q-40,-20 -35,-30 Q-25,-20 -20,-10 Q-15,-5 -10,-10 Q-5,-15 0,-10 Q5,-5 10,-10 Q15,-5 20,-10 Q25,-20 35,-30 Q40,-20 30,-10" 
          fill="none" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    
    <!-- Central staff -->
    <path d="M0,-35 L0,35" 
          stroke="url(#gradient)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Snakes intertwining -->
    <path d="M-8,-30 Q-15,-20 -8,-10 Q-2,0 8,-10 Q15,-20 8,-30" 
          fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8,-30 Q15,-20 8,-10 Q2,0 -8,-10 Q-15,-20 -8,-30" 
          fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Top circle -->
    <circle cx="0" cy="-35" r="6" fill="url(#gradient)" filter="url(#glow)"/>
    
    <!-- Bottom circle -->
    <circle cx="0" cy="35" r="6" fill="url(#gradient)" filter="url(#glow)"/>
    
    <!-- Sparkles -->
    <circle cx="-25" cy="-25" r="2" fill="#fbbf24" opacity="0.9"/>
    <circle cx="25" cy="25" r="1.5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="-30" cy="20" r="1" fill="#fbbf24" opacity="0.6"/>
    <circle cx="30" cy="-20" r="1.5" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>